<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Portfolio de modélisme : maquettes, figurines, santons et tutoriels." />
  <title>L'Atelier Médiéval — Portfolio de modélisme</title>
  <link rel="icon" href="images/logo_v7_trans.png">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>

<body data-page="tutorial-detail">
  <div class="app-shell">

    <script src="js/sidebar.js"></script>

    <main class="main-content">
      <script src="js/header.js"></script>
      <div id="app" class="page-wrap">
        <div class="detail">
          <a class="back-btn" href="instructions.html">← Retour aux tutoriels</a>
          <section class="page-hero">
            <span class="eyebrow" id="tutorial-level">
            </span>
            <h1 id="tutorial-title">
            </h1>
            <p id="tutorial-intro">
            </p>
          </section>
          <div class="tutorial-layout">
            <aside class="tools-panel">
              <h3>Outils et matériaux</h3>
              <ul id="tutorial-tools">
              </ul>
            </aside>
            <div id="tutorial-steps">
            </div>
          </div>
        </div>
        <template id="step-template">
          <article class="step">
            <div class="step-number">
            </div>
            <div>
              <h3>
              </h3>
              <div class="step-blocks">
              </div>
            </div>
          </article>
        </template>
        <template id="content-template">
          <div class="step-content">
            <p>
            </p>
            <div class="step-content-images">
            </div>
          </div>
        </template>
      </div>

      <script src="js/footer.js"></script>
    </main>

  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Fermer">×</button>
    <button class="lightbox-nav prev" id="lightboxPrev" aria-label="Précédent">‹</button>
    <figure><img id="lightboxImage" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
    <button class="lightbox-nav next" id="lightboxNext" aria-label="Suivant">›</button>
  </div>

  <script src="data/content.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
